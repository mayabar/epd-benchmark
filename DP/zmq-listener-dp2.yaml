---
# Two ZMQ listeners for vLLM DP=2.
#
# vLLM (kv_events.py :: ZmqEventPublisher.offset_endpoint_port):
#   new_port = base_port + data_parallel_rank
# So for base endpoint tcp://<host>:5557 with dp=2:
#   rank 0 -> tcp://<host>:5557
#   rank 1 -> tcp://<host>:5558
#
# The zmq-listener image (ghcr.io/llm-d/zmq-listener) uses zmq.SUB and BINDS
# on tcp://*:${ZMQ_PORT}. That means vLLM must CONNECT (endpoint without '*'),
# not bind. The vllm-dp pod is configured accordingly.
#
# One pod with two containers (shared netns) so a single Service DNS name
# can expose both ports 5557 and 5558 backed by the right listener.
apiVersion: v1
kind: Pod
metadata:
  name: zmq-listener
  namespace: mayab-dp
  labels:
    app: zmq-listener
spec:
  restartPolicy: Always
  containers:
    - name: listener-rank0
      image: ghcr.io/llm-d/zmq-listener:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: ZMQ_PORT
          value: "5557"
      ports:
        - containerPort: 5557
          name: zmq-rank0
    - name: listener-rank1
      image: ghcr.io/llm-d/zmq-listener:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: ZMQ_PORT
          value: "5558"
      ports:
        - containerPort: 5558
          name: zmq-rank1
---
apiVersion: v1
kind: Service
metadata:
  name: zmq-listener
  namespace: mayab-dp
spec:
  selector:
    app: zmq-listener
  ports:
    - name: zmq-rank0
      port: 5557
      targetPort: 5557
      protocol: TCP
    - name: zmq-rank1
      port: 5558
      targetPort: 5558
      protocol: TCP
