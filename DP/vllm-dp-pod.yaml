apiVersion: v1
kind: Pod
metadata:
  name: vllm-dp
  namespace: mayab-dp
  labels:
    app: vllm-dp
spec:
  restartPolicy: Never
  containers:
    - name: vllm
      image: vllm/vllm-openai:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          MODEL="Qwen/Qwen2.5-1.5B-Instruct"
          TOPIC="kv@${POD_IP}@${MODEL}"
          vllm serve "${MODEL}" \
            --host 0.0.0.0 \
            --port 8000 \
            --data-parallel-size 2 \
            --enforce-eager \
            --gpu-memory-utilization 0.85 \
            --max-model-len 4096 \
            --kv-events-config "{\"enable_kv_cache_events\": true, \"publisher\": \"zmq\", \"endpoint\": \"tcp://zmq-listener.mayab-dp.svc.cluster.local:5557\", \"topic\": \"${TOPIC}\"}"
      ports:
        - containerPort: 8000
          name: http
        - containerPort: 5557
          name: kv-events-0
        - containerPort: 5558
          name: kv-events-1
      env:
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        - name: VLLM_LOGGING_LEVEL
          value: "DEBUG"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: "2"
        limits:
          cpu: "16"
          memory: "64Gi"
          nvidia.com/gpu: "2"
      volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: hf-cache
      emptyDir:
        sizeLimit: 50Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-dp
  namespace: mayab-dp
spec:
  selector:
    app: vllm-dp
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: kv-events-0
      port: 5557
      targetPort: 5557
    - name: kv-events-1
      port: 5558
      targetPort: 5558
