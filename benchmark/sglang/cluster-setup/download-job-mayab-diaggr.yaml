apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
  namespace: mayab-diaggr
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: download
          image: docker.io/vllm/vllm-openai@sha256:ed3c505d2cf4b62b0ca8d0b87591bcb6fbff2a3abcc6d25732343e19b4d74f09
          command: ["hf", "download", "Qwen/Qwen3-VL-235B-A22B-Instruct-FP8"]
          env:
            - name: HF_HOME
              value: /model-cache
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: e-pd-disaggregation-nvidia-gpu-vllm-model-cache
