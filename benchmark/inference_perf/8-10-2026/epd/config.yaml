# EPD - aggregated: one vLLM pod does encode + prefill + decode.
# Blog-style run (llm-d.ai/blog/scaling-vision-heavy-kimi-vl-with-heterogeneous-epd, which used
# sglang.bench_serving --num-prompts 128 --image-count 4 --image-resolution 1080p
# --random-input-len 128 --random-output-len 128 --max-concurrency 8):
#   - rate ladder 0.5 / 1 / 1.5 / 2 req/s, 120 s per rate (so 60 / 120 / 180 / 240 requests;
#     the blog sent a fixed 128 prompts per rate instead)
#   - at most 8 requests in flight (num_workers x worker_max_concurrency = 2 x 4). Requests over
#     the cap wait in the client; latency is measured from the actual send, as in bench_serving.
#   - every request: 4 random 1080p images + 128 random text tokens (no system prompt), 128 output tokens
# One workload per rate (a separate inference-perf run each, with an idle wait in between - see
# ../../common/pre_workload.sh). Run with ./run.sh (not run_only.sh directly), so the hook is attached.

endpoint:
  stack_name: &stack_name epd              # results prefix
  model: &model Qwen/Qwen3-VL-32B-Instruct
  namespace: &namespace mayab-aggr
  base_url: &url http://aggregation-epp:80  # in-cluster gateway; scheme is required
  hf_token_secret: llm-d-hf-token

control:
  work_dir: /Users/mayab/llm-d-bench-work/epd-8-10 # autogenerated files; do not edit
  kubectl: kubectl

harness:
  name: &harness_name inference-perf
  results_pvc: mayab-workload-pvc
  namespace: *namespace
  parallelism: 1
  wait_timeout: 0                 # keep 0 on macOS (non-zero needs GNU timeout)
  image: ghcr.io/llm-d/llm-d-benchmark:v0.7.0   # ships inference-perf 0.5.0

env:
  - name: RAYON_NUM_THREADS
    value: "4"

# Workloads run in this order. Each one is a separate inference-perf run, so prompts are
# generated fresh per rate. num_groups must be >= rate x duration: prompts are reused
# (index modulo num_groups) once a run sends more requests than there are prompts.
workload:
  # Not plotted. Brings vLLM to a steady state before the measured rates.
  warmup:
    load:
      type: concurrent
      stages:
        - num_requests: 4
          concurrency_level: 1
      num_workers: 1
      worker_max_concurrency: 1
      request_timeout: 600
    api: &api
      type: chat                  # required for images
      streaming: true
    # model/url written out (not *model / *url): run_only.sh explodes each workload on its
    # own, and yq doesn't resolve an alias nested inside an alias reused by a later workload.
    server: &server
      type: vllm
      model_name: Qwen/Qwen3-VL-32B-Instruct
      base_url: http://aggregation-epp:80
      ignore_eos: true            # exactly output_len tokens
    tokenizer: &tokenizer
      pretrained_model_name_or_path: Qwen/Qwen3-VL-32B-Instruct
    data:
      # shared_prefix with 1 prompt per group and system_prompt_len 0 = nothing shared.
      # (type synthetic would also send images, but in 0.5.0 it ignores the output length
      # and always sends max_tokens=30.)
      type: shared_prefix
      multimodal: &multimodal     # fresh random images per request (made unique by the hook)
        image:
          count: { type: fixed, min: 4, max: 4, mean: 4 }
          insertion_point: 0.0    # images first, then the text
          resolutions:
            - resolution: "1080p"
              weight: 1
      shared_prefix:
        num_groups: 4
        num_prompts_per_group: 1
        system_prompt_len: 0      # no system prompt
        question_len: 128         # 128 random text tokens (excluding chat template and image tokens)
        output_len: 128
        enable_multi_turn_chat: false
    report: &report
      request_lifecycle:
        summary: true
        per_request: true

  rate_0p5:
    load: &load
      # In 0.5.0 "constant" draws exponential (Poisson-like) gaps, rescaled so exactly
      # rate x duration requests arrive within duration - like bench_serving's --request-rate.
      type: constant
      stages:
        - rate: 0.5
          duration: 120           # 60 requests
      num_workers: 2
      worker_max_concurrency: 4   # 2 x 4 = at most 8 requests in flight (bench_serving --max-concurrency 8)
      request_timeout: 1800
    api: *api
    server: *server
    tokenizer: *tokenizer
    data:
      type: shared_prefix
      multimodal: *multimodal
      shared_prefix: &shared_prefix
        num_groups: 60
        num_prompts_per_group: 1
        system_prompt_len: 0
        question_len: 128
        output_len: 128
        enable_multi_turn_chat: false
    report: *report

  rate_1:
    load:
      <<: *load
      stages:
        - rate: 1
          duration: 120           # 120 requests
    api: *api
    server: *server
    tokenizer: *tokenizer
    data:
      type: shared_prefix
      multimodal: *multimodal
      shared_prefix:
        <<: *shared_prefix
        num_groups: 120
    report: *report

  rate_1p5:
    load:
      <<: *load
      stages:
        - rate: 1.5
          duration: 120           # 180 requests
    api: *api
    server: *server
    tokenizer: *tokenizer
    data:
      type: shared_prefix
      multimodal: *multimodal
      shared_prefix:
        <<: *shared_prefix
        num_groups: 180
    report: *report

  rate_2:
    load:
      <<: *load
      stages:
        - rate: 2
          duration: 120           # 240 requests
    api: *api
    server: *server
    tokenizer: *tokenizer
    data:
      type: shared_prefix
      multimodal: *multimodal
      shared_prefix:
        <<: *shared_prefix
        num_groups: 240
    report: *report
