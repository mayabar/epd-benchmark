---
# Prometheus + Grafana for the mayab-aggr namespace, mirroring the setup in mayab-1 / mayab-2.
# Depends on the pre-existing cluster-scoped ClusterRole "prometheus-role"
# (pods get/list/watch + /metrics), shared by all of these namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: mayab-aggr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-rb-mayab-aggr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-role
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: mayab-aggr
---
# The EPP guards /metrics with a TokenReview, so its own SA needs
# system:auth-delegator (mirrors epp-auth-delegator-mayab-2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: epp-auth-delegator-mayab-aggr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: aggregation-epp
    namespace: mayab-aggr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mayab-aggr
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'vllm-metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - mayab-aggr
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_llm_d_ai_model]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_label_llm_d_ai_role]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: modelserver
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        metrics_path: /metrics
        scheme: http
      - job_name: 'epp-metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - mayab-aggr
        relabel_configs:
          # Older charts label the EPP pod "inferencepool", newer ones
          # "llm-d-router-gateway" — keep the pod if either is present.
          - source_labels:
              - __meta_kubernetes_pod_label_inferencepool
              - __meta_kubernetes_pod_label_llm_d_router_gateway
            action: keep
            regex: (.+;.*|.*;.+)
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
        metrics_path: /metrics
        scheme: http
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mayab-aggr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: Always
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mayab-aggr
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mayab-aggr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mayab-aggr
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
